services:
  api:
    build: ./services/api
    ports:
      - "5000:5000"
    environment:
      - INVENTORY_URL=http://inventory:5001
    depends_on:
      - inventory

  inventory:
    build: ./services/inventory
    ports:
      - "5001:5001"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus